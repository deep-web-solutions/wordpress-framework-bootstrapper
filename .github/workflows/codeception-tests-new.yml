name: Codeception Tests

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4 ]
        WP_VERSION: [ null, WordPress/WordPress#master ]
        include:
          - php: 8.4
            WP_VERSION: WordPress/WordPress#6.6
          - php: 8.3
            WP_VERSION: WordPress/WordPress#6.7
          - php: 8.3
            WP_VERSION: WordPress/WordPress#6.6
          - php: 8.4
            WP_VERSION: WordPress/WordPress#6.7



    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer run-script packages-install

      - name: Prepare test plugin
        run: composer update --no-dev --no-interaction --ignore-platform-reqs --working-dir=tests/Support/dws-framework-bootstrapper-test-plugin

      - name: Start wp-env
        uses: godaddy-wordpress/setup-wp-env@v1
        with:
          core: ${{ matrix.WP_VERSION }}
          phpVersion: ${{ matrix.php }}
          plugins: '[ "./tests/Support/dws-framework-bootstrapper-test-plugin" ]'

      - name: Generate DB export
        run: wp-env run cli wp db export $GITHUB_WORKSPACE/tests/Support/Data/dump.sql
